services:
    postgres:
        image: postgres:17
        container_name: backoffice-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: backoffice
            POSTGRES_PASSWORD: devpassword
            POSTGRES_DB: backoffice
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis:
        image: redis:8.10
        container_name: backoffice-redis
        restart: unless-stopped
        # Dev-only password, commited on purpose: this repo
        # is a learning project and is never deployed.
        # This wouldnt be commited in a real project.
        command: redis-server --requirepass devpassword
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis-data:/data

volumes:
    postgres-data:
    redis-data:
